services:
  - type: web
    name: nttclass
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: nttclass-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NTTCLASS_DB_PATH
        value: /var/data/nttclass.db
      - key: NTTCLASS_ADMIN_USERNAME
        value: linhAdmin
      - key: NTTCLASS_ADMIN_PASSWORD
        sync: false
      - key: NTTCLASS_ADMIN_DISPLAY_NAME
        value: Linh Admin
